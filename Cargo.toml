[package]
name = "tgif-o-matic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
axum = "0.8.9"
jiff = "0.2.35"
rand = "0.8.7"
rand_chacha = "0.3.1"
rustrict = "0.7.38"
serde = "1.0.229"
sqlx = { version = "0.9.0", features = ["sqlite", "migrate", "runtime-tokio"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.7.0", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
